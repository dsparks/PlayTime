<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1310" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="description" content="Fair, no-fuss substitution rotations for youth soccer coaches.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PlayTime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1310'/%3E%3Cpath d='M8 22V10h3.2l3 5.4 3-5.4H20v12' fill='none' stroke='%232fe3ac' stroke-width='2.6' stroke-linecap='square'/%3E%3Ccircle cx='24' cy='11' r='3' fill='%23ffa03d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PlayTime — "Touchline"
   Neutrals biased toward grass; ON/OFF on the blue-orange axis
   (the one pairing that survives red-green colour blindness);
   keeper in violet because keepers really do wear a odd kit.
   One typeface, Archivo variable, worked across its width axis:
   wide tiny caps for labels, wide huge figures for time,
   condensed heavy for the names of actual children.
   ============================================================ */

:root {
  color-scheme: light dark;

  /* Daylight — this is a sunlight mode, not a decorative light mode.
     Maximum contrast, solid fills, no washed-out tints. */
  --ground:      #ffffff;
  --raised:      #f1f5f3;
  --sunk:        #e5ebe8;
  --line:        #cbd6d1;
  --line-hard:   #97a8a1;
  --ink:         #06110d;
  --ink-2:       #3b4e48;
  --ink-3:       #6a7c75;

  --on:          #00654f;
  --on-fill:     #00876b;
  --on-ink:      #ffffff;
  --on-soft:     #d8f2ea;

  --off:         #82430b;
  --off-fill:    #b8560a;
  --off-ink:     #ffffff;
  --off-soft:    #fbe8d6;

  --gk:          #55299f;
  --gk-fill:     #7040d8;
  --gk-ink:      #ffffff;
  --gk-soft:     #ebe2ff;

  --alert:       #9e1329;
  --alert-fill:  #cc2340;
  --alert-ink:   #ffffff;
  --alert-soft:  #fce2e6;

  --shadow-1: 0 1px 2px rgba(6,17,13,.10);
  --shadow-2: 0 2px 4px rgba(6,17,13,.08), 0 12px 28px -14px rgba(6,17,13,.30);
  --sheet-shadow: 0 -8px 40px -8px rgba(6,17,13,.28);

  --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --tap: 52px;
  --pad: 14px;
}

/* Night */
@media (prefers-color-scheme: dark) {
  :root {
    --ground:    #0b1310;
    --raised:    #141f1b;
    --sunk:      #101a16;
    --line:      #24322c;
    --line-hard: #3d4f47;
    --ink:       #eef6f2;
    --ink-2:     #9db0a8;
    --ink-3:     #71857d;

    --on:        #2fe3ac;
    --on-fill:   #2fe3ac;
    --on-ink:    #032018;
    --on-soft:   rgba(47,227,172,.14);

    --off:       #ffa03d;
    --off-fill:  #ffa03d;
    --off-ink:   #2a1600;
    --off-soft:  rgba(255,160,61,.14);

    --gk:        #b98bff;
    --gk-fill:   #b98bff;
    --gk-ink:    #1b0b38;
    --gk-soft:   rgba(185,139,255,.16);

    --alert:     #ff6377;
    --alert-fill:#ff6377;
    --alert-ink: #2b0008;
    --alert-soft:rgba(255,99,119,.16);

    --shadow-1: 0 1px 2px rgba(0,0,0,.5);
    --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 16px 32px -16px rgba(0,0,0,.7);
    --sheet-shadow: 0 -8px 40px -8px rgba(0,0,0,.7);
  }
}

/* Explicit overrides must beat the media query in both directions. */
:root[data-theme="night"] {
  --ground:#0b1310; --raised:#141f1b; --sunk:#101a16;
  --line:#24322c; --line-hard:#3d4f47;
  --ink:#eef6f2; --ink-2:#9db0a8; --ink-3:#71857d;
  --on:#2fe3ac; --on-fill:#2fe3ac; --on-ink:#032018; --on-soft:rgba(47,227,172,.14);
  --off:#ffa03d; --off-fill:#ffa03d; --off-ink:#2a1600; --off-soft:rgba(255,160,61,.14);
  --gk:#b98bff; --gk-fill:#b98bff; --gk-ink:#1b0b38; --gk-soft:rgba(185,139,255,.16);
  --alert:#ff6377; --alert-fill:#ff6377; --alert-ink:#2b0008; --alert-soft:rgba(255,99,119,.16);
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 16px 32px -16px rgba(0,0,0,.7);
  --sheet-shadow:0 -8px 40px -8px rgba(0,0,0,.7);
}
:root[data-theme="day"] {
  --ground:#ffffff; --raised:#f1f5f3; --sunk:#e5ebe8;
  --line:#cbd6d1; --line-hard:#97a8a1;
  --ink:#06110d; --ink-2:#3b4e48; --ink-3:#6a7c75;
  --on:#00654f; --on-fill:#00876b; --on-ink:#ffffff; --on-soft:#d8f2ea;
  --off:#82430b; --off-fill:#b8560a; --off-ink:#ffffff; --off-soft:#fbe8d6;
  --gk:#55299f; --gk-fill:#7040d8; --gk-ink:#ffffff; --gk-soft:#ebe2ff;
  --alert:#9e1329; --alert-fill:#cc2340; --alert-ink:#ffffff; --alert-soft:#fce2e6;
  --shadow-1:0 1px 2px rgba(6,17,13,.10);
  --shadow-2:0 2px 4px rgba(6,17,13,.08), 0 12px 28px -14px rgba(6,17,13,.30);
  --sheet-shadow:0 -8px 40px -8px rgba(6,17,13,.28);
}

/* ---- reset & base ---- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--on-fill); outline-offset: 2px; border-radius: 4px; }

/* ---- type roles, driven by Archivo's width axis ---- */
.lbl {                                   /* equipment labels: tiny, wide, spaced */
  font-size: 10.5px; font-weight: 650;
  font-variation-settings: 'wdth' 118, 'wght' 650;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-3);
}
.fig {                                   /* the instrument voice: time, scores */
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  font-variation-settings: 'wdth' 112, 'wght' 800;
  letter-spacing: -.01em;
}
.nm {                                    /* the human voice: children's names */
  font-weight: 750;
  font-variation-settings: 'wdth' 92, 'wght' 750;
  letter-spacing: -.005em;
}

/* ---- app frame ---- */
#app {
  height: 100dvh;
  display: flex; flex-direction: column;
  max-width: 620px; margin: 0 auto;
}
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 var(--pad) 12px; }

/* ---- top rail ---- */
.rail {
  display: flex; align-items: center; gap: 10px;
  padding: 8px var(--pad); min-height: 46px;
  padding-top: calc(8px + env(safe-area-inset-top));
  border-bottom: 1px solid var(--line);
}
.rail .grow { flex: 1; min-width: 0; }
.rail-btn {
  width: 40px; height: 40px; border-radius: var(--r-md);
  display: grid; place-items: center; color: var(--ink-2);
  font-size: 20px; line-height: 1;
}
.rail-btn:active { background: var(--sunk); }
.wordmark {
  display: flex; align-items: baseline; gap: 7px;
  font-size: 17px; font-weight: 800;
  font-variation-settings: 'wdth' 112, 'wght' 800;
  letter-spacing: -.02em;
}
.wordmark i {
  width: 9px; height: 16px; background: var(--on-fill);
  transform: skewX(-13deg); display: inline-block; align-self: center;
}

/* period + clock cluster in the match rail */
.rail-clock { display: flex; align-items: baseline; gap: 8px; }
.period-chip {
  font-size: 11px; font-weight: 750;
  font-variation-settings: 'wdth' 118, 'wght' 750;
  letter-spacing: .1em; padding: 3px 7px; border-radius: var(--r-sm);
  background: var(--sunk); color: var(--ink-2);
}
.period-chip.live { background: var(--on-soft); color: var(--on); }
.rail-time { font-size: 21px; }
.rail-time.paused { color: var(--ink-3); }
.rail-score {
  display: flex; align-items: baseline; gap: 6px; font-size: 19px;
  min-height: 40px; padding: 0 8px; border-radius: var(--r-md);
}
.rail-score:active { background: var(--sunk); }
.rail-score .sep { color: var(--ink-3); font-weight: 500; }
.rail-score .us { color: var(--on); }

/* ---- progress: one segment per period, ticked at each sub ---- */
.prog { display: flex; gap: 3px; padding: 0 var(--pad); margin-top: 8px; }
.prog-seg {
  flex: 1; height: 5px; border-radius: 3px; background: var(--sunk);
  position: relative; overflow: hidden;
}
.prog-seg .fill { position: absolute; inset: 0 auto 0 0; background: var(--on-fill); }
.prog-seg .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ground); opacity: .85; }

/* ============ MATCH SCREEN ============ */
.match { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.match-body {
  flex: 1; display: flex; flex-direction: column; gap: 12px;
  padding: 12px var(--pad) 0; min-height: 0; overflow-y: auto;
}

/* hero countdown */
.hero { text-align: center; padding: 4px 0 2px; }
.hero .cd {
  font-size: clamp(58px, 19vw, 104px); line-height: .88;
  font-variant-numeric: tabular-nums;
  font-weight: 800; font-variation-settings: 'wdth' 108, 'wght' 800;
  letter-spacing: -.03em;
}
.hero .cd.warn { color: var(--off); }
.hero .sub { margin-top: 7px; }
.hero.due .cd {
  font-size: clamp(44px, 14vw, 76px);
  color: var(--off);
  animation: pulse 1.15s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .42 } }
@media (prefers-reduced-motion: reduce) {
  .hero.due .cd { animation: none; }
}

/* ---- the substitution board ---- */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.board.solo { grid-template-columns: 1fr; }
.col {
  border: 2px solid var(--line); border-radius: var(--r-lg);
  padding: 10px; min-height: 118px;
  display: flex; flex-direction: column; gap: 8px;
  background: var(--raised);
}
.col.out { border-color: var(--off); background: var(--off-soft); }
.col.in  { border-color: var(--on);  background: var(--on-soft); }
.col-head { display: flex; align-items: center; gap: 6px; }
.col-head .arrow { font-size: 15px; line-height: 1; }
.col.out .col-head, .col.out .arrow { color: var(--off); }
.col.in  .col-head, .col.in  .arrow { color: var(--on); }
.col-names { display: flex; flex-direction: column; gap: 5px; }
.col-names .who {
  font-size: clamp(19px, 5.6vw, 27px); line-height: 1.12;
  font-weight: 750; font-variation-settings: 'wdth' 90, 'wght' 780;
  overflow-wrap: anywhere;
}
.col.out .who { color: var(--off); }
.col.in  .who { color: var(--on); }
.col-empty { color: var(--ink-3); font-size: 14px; font-style: italic; }

/* when the buzzer has gone the board goes solid — readable at arm's length */
.due-state .col.out { background: var(--off-fill); border-color: var(--off-fill); }
.due-state .col.out .who, .due-state .col.out .col-head, .due-state .col.out .arrow { color: var(--off-ink); }
.due-state .col.in { background: var(--on-fill); border-color: var(--on-fill); }
.due-state .col.in .who, .due-state .col.in .col-head, .due-state .col.in .arrow { color: var(--on-ink); }

.keeper-swap {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 11px; border-radius: var(--r-md);
  background: var(--gk-soft); color: var(--gk);
  font-size: 15px;
}
.keeper-swap .nm { font-size: 17px; }

/* ---- on-pitch strip ---- */
.strip { display: flex; flex-direction: column; gap: 7px; }
.strip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 6px 10px; border-radius: var(--r-md);
  background: var(--sunk); border: 1px solid transparent;
  font-size: 15px; font-weight: 700;
  font-variation-settings: 'wdth' 94, 'wght' 720;
}
.chip .t {
  font-size: 11px; font-variant-numeric: tabular-nums;
  font-variation-settings: 'wdth' 108, 'wght' 600;
  color: var(--ink-3);
}
.chip.pitch { background: var(--on-soft); color: var(--on); }
.chip.pitch .t { color: var(--on); opacity: .75; }
.chip.keeper { background: var(--gk-soft); color: var(--gk); }
.chip.keeper .t { color: var(--gk); opacity: .75; }
.chip.bench { background: var(--sunk); color: var(--ink-2); }
.chip.gone { opacity: .45; text-decoration: line-through; }
.chip.tapable:active { transform: scale(.96); }
.chip.picked { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }

/* ---- dock: everything you press mid-match lives in the thumb zone ---- */
.dock {
  display: flex; gap: 8px; padding: 10px var(--pad);
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--ground);
}
.btn {
  border-radius: var(--r-md); min-height: var(--tap);
  padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 15px; font-weight: 750;
  font-variation-settings: 'wdth' 106, 'wght' 750;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--raised); border: 1.5px solid var(--line);
  transition: transform .09s ease, background .12s ease;
}
.btn:active { transform: scale(.975); }
.btn:disabled { opacity: .38; pointer-events: none; }
.btn.grow { flex: 1; min-width: 0; }
.btn.square { width: var(--tap); padding: 0; flex: none; font-size: 19px; }
.btn.go     { background: var(--on-fill);  color: var(--on-ink);  border-color: var(--on-fill); }
.btn.warn   { background: var(--off-fill); color: var(--off-ink); border-color: var(--off-fill); }
.btn.danger { background: transparent; color: var(--alert); border-color: var(--alert); }
.btn.quiet  { background: transparent; color: var(--ink-2); }
.btn.big { min-height: 62px; font-size: 19px; letter-spacing: .06em; }
.btn.tall { min-height: 58px; }

/* ---- generic surfaces ---- */
.card {
  background: var(--raised); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--pad);
}
.card + .card { margin-top: 12px; }
.sec { margin-top: 20px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.note { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.hr { height: 1px; background: var(--line); margin: 14px 0; border: 0; }

/* ---- roster tiles (attendance) ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile {
  min-height: 62px; border-radius: var(--r-md);
  border: 2px solid var(--line); background: var(--raised);
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  padding: 8px 10px; gap: 2px; text-align: left;
  color: var(--ink-3); transition: transform .09s ease;
}
.tile:active { transform: scale(.97); }
.tile .who { font-size: 16px; font-weight: 750; font-variation-settings: 'wdth' 90, 'wght' 750; overflow-wrap: anywhere; }
.tile .meta { font-size: 10.5px; font-variation-settings: 'wdth' 115, 'wght' 650; letter-spacing: .12em; text-transform: uppercase; }
.tile.in { border-color: var(--on); background: var(--on-soft); color: var(--on); }
.tile.in .meta { color: var(--on); opacity: .8; }
.tile.keeper { border-color: var(--gk); background: var(--gk-soft); color: var(--gk); }
.tile.keeper .meta { color: var(--gk); opacity: .85; }

/* ---- stepper ---- */
.steps { display: grid; gap: 8px; }
.step { display: flex; align-items: center; gap: 10px; min-height: var(--tap); }
.step .cap { flex: 1; min-width: 0; }
.step .cap .t { font-size: 15px; font-weight: 700; font-variation-settings: 'wdth' 100, 'wght' 700; }
.step .cap .s { font-size: 12px; color: var(--ink-3); }
.step .ctl { display: flex; align-items: center; gap: 4px; }
.step .ctl button {
  width: 42px; height: 42px; border-radius: var(--r-sm);
  background: var(--sunk); font-size: 20px; font-weight: 700;
  display: grid; place-items: center;
}
.step .ctl button:active { background: var(--line); }
.step .ctl .val {
  min-width: 62px; text-align: center; font-size: 19px;
  font-variant-numeric: tabular-nums; font-weight: 800;
  font-variation-settings: 'wdth' 108, 'wght' 800;
}
.segs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: var(--r-md); }
.segs button {
  flex: 1; min-height: 42px; border-radius: var(--r-sm);
  font-size: 14px; font-weight: 700; font-variation-settings: 'wdth' 104, 'wght' 700;
  color: var(--ink-3);
}
.segs button.on { background: var(--ground); color: var(--ink); box-shadow: var(--shadow-1); }

.switch { display: flex; align-items: center; gap: 12px; min-height: var(--tap); }
.switch .cap { flex: 1; }
.switch .track {
  width: 50px; height: 30px; border-radius: 999px; flex: none;
  background: var(--sunk); border: 1px solid var(--line); position: relative;
  transition: background .16s ease, border-color .16s ease;
}
.switch .track::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 22px; height: 22px; border-radius: 50%; background: var(--ink-3);
  transition: transform .16s ease, background .16s ease;
}
.switch.on .track { background: var(--on-soft); border-color: var(--on); }
.switch.on .track::after { transform: translateX(20px); background: var(--on-fill); }

/* ---- minutes bars ---- */
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar-row { display: grid; grid-template-columns: minmax(64px, 88px) 1fr auto; gap: 10px; align-items: center; }
.bar-row .who { font-size: 14px; font-weight: 720; font-variation-settings: 'wdth' 90, 'wght' 720; overflow-wrap: anywhere; }
.bar-track { height: 20px; border-radius: var(--r-sm); background: var(--sunk); overflow: hidden; display: flex; }
.bar-fill { background: var(--on-fill); height: 100%; }
.bar-fill.gk { background: var(--gk-fill); }
.bar-row .t { font-size: 13px; font-variant-numeric: tabular-nums; font-variation-settings: 'wdth' 108, 'wght' 700; min-width: 46px; text-align: right; }
.bar-row.least .who { color: var(--on); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

/* ---- sheet ---- */
/* Sheets sit above the half-time curtain — the curtain has a button that
   opens one. */
.veil {
  position: fixed; inset: 0; background: rgba(4,12,9,.55);
  display: flex; align-items: flex-end; justify-content: center; z-index: 80;
  animation: fade .16s ease-out;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.sheet {
  width: 100%; max-width: 620px; max-height: 88dvh;
  background: var(--ground); border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: var(--sheet-shadow);
  display: flex; flex-direction: column; overflow: hidden;
  animation: rise .22s cubic-bezier(.2,.8,.3,1);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes rise { from { transform: translateY(14px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) {
  .veil, .sheet { animation: none; }
}
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px var(--pad) 10px; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 800; font-variation-settings: 'wdth' 108, 'wght' 800; letter-spacing: -.01em; flex: 1; }
.sheet-body { overflow-y: auto; padding: 0 var(--pad) 14px; }
.sheet-foot { padding: 10px var(--pad) 14px; border-top: 1px solid var(--line); }
.grabber { width: 36px; height: 4px; border-radius: 2px; background: var(--line-hard); margin: 8px auto 0; }

/* ---- full-bleed break / full-time overlay ---- */
.curtain {
  position: fixed; inset: 0; z-index: 70; background: var(--ground);
  display: flex; flex-direction: column;
  padding: max(24px, env(safe-area-inset-top)) var(--pad) calc(16px + env(safe-area-inset-bottom));
  animation: fade .18s ease-out;
}
.curtain .big-label { font-size: clamp(30px, 9vw, 46px); font-weight: 850; font-variation-settings: 'wdth' 116, 'wght' 850; letter-spacing: -.02em; line-height: 1; }
.curtain .score-line { font-size: clamp(46px, 15vw, 78px); font-variant-numeric: tabular-nums; font-weight: 850; font-variation-settings: 'wdth' 112, 'wght' 850; line-height: 1; }

/* ---- inputs ---- */
.input {
  width: 100%; min-height: var(--tap); padding: 12px 14px;
  background: var(--sunk); border: 1.5px solid var(--line);
  border-radius: var(--r-md); color: var(--ink);
  font-family: var(--sans); font-size: 16px; font-weight: 650;
}
.input:focus { outline: none; border-color: var(--on-fill); }
.row { display: flex; gap: 8px; }
.row .input { flex: 1; }

/* ---- toast ---- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 90;
  display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--ground);
  padding: 11px 14px; border-radius: var(--r-md);
  font-size: 14px; font-weight: 700; box-shadow: var(--shadow-2);
  max-width: calc(100% - 28px); animation: rise .18s ease-out;
}
.toast button { color: var(--on-fill); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }

.empty { text-align: center; color: var(--ink-3); font-size: 14px; padding: 22px 10px; line-height: 1.6; }

/* Landscape: put the board beside the clock rather than under it. */
@media (orientation: landscape) and (max-height: 520px) {
  #app { max-width: none; }
  .match-body { display: grid; grid-template-columns: minmax(190px, 34%) 1fr; align-items: start; gap: 14px; }
  .hero { grid-column: 1; }
  .board { grid-column: 2; }
  .strip { grid-column: 1 / -1; }
  .hero .cd { font-size: clamp(44px, 10vw, 72px); }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script>
"use strict";
/* =====================================================================
   PlayTime
   A rotation clock for coaches who are also the referee, the timekeeper
   and the parent of one of the players.
   ===================================================================== */

/* ------------------------------ storage ---------------------------- */
const KEY = 'playtime.v3';
const LEGACY_CFG = 'soccer-rotation-v1';
const LEGACY_LIVE = 'playtime-live-game-v1';

const uid = () => Math.random().toString(36).slice(2, 9);

function defaults() {
  return {
    v: 3,
    roster: [],
    lastSquad: [],
    cfg: {
      periods: 2,        // 2 halves or 4 quarters
      periodMin: 20,
      stintMin: 4,
      onField: 4,        // includes the keeper when keepers are on
      useGk: false,
      gkEvery: 2,        // keeper changes every N stints
      gkCounts: true,    // does time in goal count as playing time?
      pauseAtSub: true,
      sound: true,
      haptics: true,
      theme: 'auto',
    },
    game: null,
  };
}

/* Bring across a roster and settings from the old version rather than
   making the coach retype eight five-year-olds' names. */
function importLegacy(S) {
  try {
    const raw = localStorage.getItem(LEGACY_CFG);
    if (!raw) return S;
    const old = JSON.parse(raw);
    if (!Array.isArray(old.players) || !old.players.length) return S;
    const keepers = old.goalkeeperNames || [];
    S.roster = old.players.map(n => ({ id: uid(), name: String(n), gk: keepers.includes(n) }));
    S.lastSquad = S.roster.map(p => p.id);
    const gl = Number(old.gameLength) || 40;
    S.cfg.periods = 2;
    S.cfg.periodMin = Math.max(1, Math.round(gl / 2));
    S.cfg.stintMin = Math.max(1, Math.round(Number(old.stintLength) || 4));
    S.cfg.onField = Math.max(1, Number(old.numOnField) || 4);
    S.cfg.useGk = !!old.hasGoalkeeper;
    S.cfg.gkEvery = Math.max(1, Number(old.goalkeeperBlockStints) || 2);
    localStorage.removeItem(LEGACY_LIVE);
  } catch (e) { /* a bad legacy blob is not worth a broken app */ }
  return S;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const merged = Object.assign(defaults(), s, { cfg: Object.assign(defaults().cfg, s.cfg || {}) });
      if (merged.game && !merged.game.hist) merged.game.hist = [];
      return merged;
    }
  } catch (e) { /* fall through to a clean slate */ }
  return importLegacy(defaults());
}

let S = load();
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const write = () => {
    try {
      syncClock();
      S.savedAt = Date.now();
      // undo history is deliberately not persisted — it is worth a dozen
      // deep copies in memory, not in localStorage
      localStorage.setItem(KEY, JSON.stringify(S, (k, v) => (k === 'hist' ? undefined : v)));
    } catch (e) {}
  };
  if (now) write(); else saveTimer = setTimeout(write, 250);
}

/* ------------------------------ helpers ---------------------------- */
const byId = (id) => S.roster.find(p => p.id === id);
const nameOf = (id) => (byId(id) || {}).name || '—';
/* Tie-break order. Within a match it is frozen per game so "shuffle"
   can produce a different-but-equally-fair XI without reordering the
   coach's team list for ever. */
function orderOf(id) {
  const t = S.game && S.game.tieOrder;
  if (t) { const i = t.indexOf(id); if (i >= 0) return i; }
  const i = S.roster.findIndex(p => p.id === id);
  return i < 0 ? 999 : i;
}

const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

function mmss(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
function mins(ms) { return Math.round(ms / 60000); }
function minsPrecise(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  return Math.floor(t / 60) + 'm ' + String(t % 60).padStart(2, '0') + 's';
}
const periodName = (n, total) => total === 4 ? 'Q' + n : (n === 1 ? '1ST' : '2ND');
const periodLong = (n, total) => total === 4
  ? ['1st quarter', '2nd quarter', '3rd quarter', '4th quarter'][n - 1]
  : (n === 1 ? '1st half' : '2nd half');
const breakName = (n, total) => (total === 2 && n === 1) ? 'Half time' : 'End of ' + periodLong(n, total);

/* ======================================================================
   The rotation planner. Pure functions only — no DOM, no module state,
   everything passed in. test/logic.test.mjs lifts the code between these
   two markers straight out of this file and exercises it, so the tests
   can never drift from what actually ships.
   ====================================================================== */
//#region logic

function stintsPerPeriod(cfg) {
  return Math.max(1, Math.round(cfg.periodMin / Math.max(0.5, cfg.stintMin)));
}
function stintMs(cfg) {
  return (cfg.periodMin * 60000) / stintsPerPeriod(cfg);
}
function periodMs(cfg) {
  return cfg.periodMin * 60000;
}
/* Boundary that ends the given stint index (0-based) within a period. */
function boundaryMs(cfg, stint) {
  return Math.min(periodMs(cfg), (stint + 1) * stintMs(cfg));
}
function globalStint(cfg, period, stint) {
  return (period - 1) * stintsPerPeriod(cfg) + stint;
}

function onPitch(g) {
  return g.gk ? [g.gk, ...g.field] : g.field.slice();
}

/* Live playing time, including the stint in progress. */
function playedNow(g, id) {
  const live = (g.state === 'live' && onPitch(g).includes(id)) ? (g.clockMs - g.segStart) : 0;
  return (g.played[id] || 0) + Math.max(0, live);
}

/* Who keeps goal for this block? Least time in goal wins; among equals,
   whoever has played least overall, so the gloves spread out too. */
function pickKeeper(eligible, ctx, avoid) {
  const pool = eligible.filter(p => p !== avoid);
  const from = pool.length ? pool : eligible;
  return from.slice().sort((a, b) =>
    (ctx.gkMs[a] || 0) - (ctx.gkMs[b] || 0) ||
    (ctx.fair[a] || 0) - (ctx.fair[b] || 0) ||
    ctx.order(a) - ctx.order(b)
  )[0] || null;
}

/* The whole fairness engine: put the N children who have played least on
   the field. Ties break toward whoever is currently sitting, then toward
   whoever has been sitting longest. Because the ones coming on are by
   definition the least-played, they will not be picked to come straight
   off again — the rule is self-stabilising, and it self-corrects after
   any manual swap, late arrival or early departure. */
function pickField(candidates, n, ctx) {
  const on = new Set(ctx.onPitch);
  return candidates.slice().sort((a, b) =>
    (ctx.fair[a] || 0) - (ctx.fair[b] || 0) ||
    (on.has(a) ? 1 : 0) - (on.has(b) ? 1 : 0) ||
    (ctx.lastOff[a] || 0) - (ctx.lastOff[b] || 0) ||
    ctx.order(a) - ctx.order(b)
  ).slice(0, Math.max(0, n));
}

/* Work out the lineup for the stint after the current one.
   `ctx.fair` should already be projected forward to the boundary so the
   answer does not wobble as the current stint ticks away. */
function planNext(ctx, cfg, opts) {
  const avail = ctx.avail;
  const keepers = ctx.keepers.filter(p => avail.includes(p));
  const useGk = cfg.useGk && keepers.length > 0 && avail.length > 1;

  let gk = null;
  if (useGk) {
    const every = Math.max(1, cfg.gkEvery);
    const sameBlock = opts.prevGlobal != null &&
      Math.floor(opts.nextGlobal / every) === Math.floor(opts.prevGlobal / every);
    gk = (sameBlock && ctx.gk && avail.includes(ctx.gk))
      ? ctx.gk
      : pickKeeper(keepers, ctx, ctx.gk);
  }

  const slots = Math.max(0, cfg.onField - (gk ? 1 : 0));
  const candidates = avail.filter(p => p !== gk);
  const field = pickField(candidates, Math.min(slots, candidates.length), ctx);

  const before = new Set(ctx.onPitch);
  const after = new Set(gk ? [gk, ...field] : field);
  return {
    gk,
    field: field.slice().sort((a, b) => ctx.order(a) - ctx.order(b)),
    out: [...before].filter(p => !after.has(p)).sort((a, b) => ctx.order(a) - ctx.order(b)),
    in: [...after].filter(p => !before.has(p)).sort((a, b) => ctx.order(a) - ctx.order(b)),
    gkFrom: ctx.gk || null,
    gkTo: gk,
  };
}

/* Look the whole rest of the match forward, so the lineup screen can
   promise everyone roughly equal minutes before a ball is kicked. */
function project(g, cfg, roster, orderFn) {
  const spp = stintsPerPeriod(cfg);
  const sms = stintMs(cfg);
  const order = orderFn || ((id) => { const i = roster.findIndex(p => p.id === id); return i < 0 ? 999 : i; });
  const keepers = roster.filter(p => p.gk).map(p => p.id);
  const avail = g.squad.filter(id => !g.out.includes(id));

  const sim = {
    played: Object.assign({}, g.played),
    gkMs: Object.assign({}, g.gkMs),
    lastOff: Object.assign({}, g.lastOff),
    field: g.field.slice(),
    gk: g.gk,
  };
  const stints = [];
  let period = g.period;
  let stint = g.stint;
  let elapsedIntoStint = Math.max(0, g.clockMs - g.segStart);
  let firstIsCurrent = g.state === 'live' || g.state === 'break';

  // if the match has not started, seed stint 0 from the pending lineup
  if (g.state === 'pre') {
    const p0 = g.pending;
    if (p0) { sim.field = p0.field.slice(); sim.gk = p0.gk; }
    firstIsCurrent = true;
    elapsedIntoStint = 0;
  }

  const total = cfg.periods * spp;
  let guard = 0;
  while (guard++ < 200) {
    const gStint = globalStint(cfg, period, stint);
    if (gStint >= total) break;

    const dur = firstIsCurrent ? Math.max(0, sms - elapsedIntoStint) : sms;
    firstIsCurrent = false;

    const pitch = sim.gk ? [sim.gk, ...sim.field] : sim.field.slice();
    pitch.forEach(id => { sim.played[id] = (sim.played[id] || 0) + dur; });
    if (sim.gk) sim.gkMs[sim.gk] = (sim.gkMs[sim.gk] || 0) + dur;

    stints.push({ period, stint, gk: sim.gk, field: sim.field.slice() });

    // advance
    let nPeriod = period, nStint = stint + 1;
    if (nStint >= spp) { nPeriod = period + 1; nStint = 0; }
    if (globalStint(cfg, nPeriod, nStint) >= total) break;

    const fair = {};
    avail.forEach(id => {
      fair[id] = cfg.gkCounts ? (sim.played[id] || 0) : (sim.played[id] || 0) - (sim.gkMs[id] || 0);
    });
    const next = planNext({
      avail, keepers, gk: sim.gk, onPitch: pitch,
      fair, gkMs: sim.gkMs, lastOff: sim.lastOff, order,
    }, cfg, {
      prevGlobal: gStint,
      nextGlobal: globalStint(cfg, nPeriod, nStint),
    });
    next.out.forEach(id => { sim.lastOff[id] = gStint; });
    sim.field = next.field; sim.gk = next.gk;
    period = nPeriod; stint = nStint;
  }

  const totals = {};
  avail.forEach(id => { totals[id] = sim.played[id] || 0; });
  return { stints, totals, gkTotals: sim.gkMs };
}

//#endregion logic

/* ------------------------- game construction ----------------------- */
function newGame(squad) {
  const g = {
    squad: squad.slice(),
    out: [],
    state: 'pre',
    period: 1,
    clockMs: 0,
    running: false,
    runFrom: null,
    runBase: 0,
    stint: 0,
    segStart: 0,
    field: [],
    gk: null,
    played: {},
    gkMs: {},
    lastOff: {},
    pending: null,
    due: false,
    goals: [],
    hist: [],
    tieOrder: squad.slice(),
    startedAt: Date.now(),
  };
  squad.forEach(id => { g.played[id] = 0; g.gkMs[id] = 0; g.lastOff[id] = 0; });
  g.pending = computePending(g, true);
  return g;
}

function ctxFor(g, projectToBoundary) {
  const avail = g.squad.filter(id => !g.out.includes(id));
  const pitch = onPitch(g);
  const remaining = projectToBoundary
    ? Math.max(0, boundaryMs(S.cfg, g.stint) - Math.max(g.segStart, g.clockMs))
    : 0;
  const fair = {};
  avail.forEach(id => {
    let v = playedNow(g, id) + (pitch.includes(id) ? remaining : 0);
    if (!S.cfg.gkCounts) v -= (g.gkMs[id] || 0);
    fair[id] = v;
  });
  return {
    avail,
    keepers: S.roster.filter(p => p.gk).map(p => p.id),
    gk: g.gk,
    onPitch: pitch,
    fair,
    gkMs: g.gkMs,
    lastOff: g.lastOff,
    order: orderOf,
  };
}

/* The starting lineup, or the lineup for the stint after this one. */
function computePending(g, isStart) {
  const spp = stintsPerPeriod(S.cfg);
  if (isStart) {
    const ctx = ctxFor(g, false);
    ctx.onPitch = [];
    return planNext(ctx, S.cfg, { prevGlobal: null, nextGlobal: 0 });
  }
  let nPeriod = g.period, nStint = g.stint + 1;
  if (nStint >= spp) { nPeriod += 1; nStint = 0; }
  if (nPeriod > S.cfg.periods) return null;
  return planNext(ctxFor(g, true), S.cfg, {
    prevGlobal: globalStint(S.cfg, g.period, g.stint),
    nextGlobal: globalStint(S.cfg, nPeriod, nStint),
  });
}

/* Bank the time everyone on the pitch has just played. */
function commit(g) {
  const dt = Math.max(0, g.clockMs - g.segStart);
  if (dt > 0) {
    onPitch(g).forEach(id => { g.played[id] = (g.played[id] || 0) + dt; });
    if (g.gk) g.gkMs[g.gk] = (g.gkMs[g.gk] || 0) + dt;
  }
  g.segStart = g.clockMs;
}

function snapshot(g) {
  const rest = Object.assign({}, g);
  delete rest.hist;
  g.hist.push(JSON.parse(JSON.stringify(rest)));
  if (g.hist.length > 12) g.hist.shift();
}

/* Undo rolls back the decision, not the clock. The match kept going while
   the coach worked out that they had tapped the wrong name, so the time
   since then belongs to whoever the undo puts back on the pitch. */
function undo() {
  const g = S.game;
  if (!g || !g.hist.length) return false;
  const h = g.hist.pop();
  const hist = g.hist;
  const keepClock = h.period === g.period;
  const live = { clockMs: g.clockMs, running: g.running, runFrom: g.runFrom, runBase: g.runBase };
  S.game = Object.assign(h, { hist });
  if (keepClock) Object.assign(S.game, live);
  if (S.game.running) { S.game.runFrom = Date.now(); S.game.runBase = S.game.clockMs; }
  S.game.pending = computePending(S.game, S.game.state === 'pre');
  save(); render();
  return true;
}

/* --------------------------- clock control ------------------------- */
function startClock() {
  const g = S.game; if (!g) return;
  if (g.state === 'pre') {
    // put the starting lineup on the pitch
    const p = g.pending || computePending(g, true);
    g.field = p.field.slice(); g.gk = p.gk;
    g.state = 'live'; g.segStart = 0;
    g.pending = computePending(g, false);
  }
  g.running = true;
  g.runFrom = Date.now();
  g.runBase = g.clockMs;
  horn.unlock();
  wake.on();
  save(); render();
}
function pauseClock() {
  const g = S.game; if (!g || !g.running) return;
  syncClock();
  g.running = false; g.runFrom = null;
  wake.off();
  save(); render();
}
function syncClock() {
  const g = S.game;
  if (!g || !g.running || g.runFrom == null) return;
  g.clockMs = Math.min(periodMs(S.cfg), g.runBase + (Date.now() - g.runFrom));
}
/* Nudging the clock corrects the timer, nothing else. The current shift
   slides along with it, so everyone's minutes read exactly the same
   before and after — banking them first would credit the rewound
   seconds twice. The stint counter stays where the real subs happened. */
function setClock(ms) {
  const g = S.game; if (!g) return;
  syncClock();
  snapshot(g);
  const next = clamp(ms, 0, periodMs(S.cfg));
  const delta = next - g.clockMs;
  g.clockMs = next;
  g.segStart = clamp(g.segStart + delta, 0, next);
  g.runBase = g.clockMs; g.runFrom = Date.now();
  g.due = false;
  g.pending = computePending(g, false);
  save(); render();
}

/* --------------------------- the sub loop -------------------------- */
function raiseDue(endOfPeriod) {
  const g = S.game;
  g.due = true;
  if (S.cfg.pauseAtSub && g.running) { syncClock(); g.running = false; g.runFrom = null; wake.off(); }
  if (endOfPeriod) {
    commit(g);
    g.state = (g.period >= S.cfg.periods) ? 'ft' : 'break';
    g.running = false; g.runFrom = null; wake.off();
    if (g.state === 'ft') { horn.fullTime(); buzz([220, 90, 220, 90, 420]); }
    else { horn.periodEnd(); buzz([200, 100, 200, 100, 200]); }
  } else {
    horn.subDue(); buzz([180, 90, 180]);
  }
  save(); render();
}

/* Apply the lineup the coach has been looking at, and start the next stint. */
function applySubs() {
  const g = S.game; if (!g) return;
  snapshot(g);
  commit(g);
  const p = g.pending || computePending(g, false);
  if (p) {
    const before = new Set(onPitch(g));
    g.field = p.field.slice();
    g.gk = p.gk;
    const after = new Set(onPitch(g));
    before.forEach(id => { if (!after.has(id)) g.lastOff[id] = globalStint(S.cfg, g.period, g.stint); });
  }
  g.stint = Math.min(g.stint + 1, stintsPerPeriod(S.cfg) - 1);
  g.due = false;
  g.pending = computePending(g, false);
  if (S.cfg.pauseAtSub) { g.running = true; g.runFrom = Date.now(); g.runBase = g.clockMs; wake.on(); }
  toast('Subs made', 'Undo', undo);
  save(); render();
}

function startNextPeriod() {
  const g = S.game; if (!g) return;
  snapshot(g);
  commit(g);
  const p = g.pending || computePending(g, false);
  if (p) {
    const before = new Set(onPitch(g));
    g.field = p.field.slice(); g.gk = p.gk;
    const after = new Set(onPitch(g));
    before.forEach(id => { if (!after.has(id)) g.lastOff[id] = globalStint(S.cfg, g.period, g.stint); });
  }
  g.period += 1;
  g.stint = 0;
  g.clockMs = 0; g.segStart = 0;
  g.state = 'live'; g.due = false;
  g.running = true; g.runFrom = Date.now(); g.runBase = 0;
  g.pending = computePending(g, false);
  wake.on(); horn.unlock();
  save(); render();
}

function endMatch() {
  const g = S.game; if (!g) return;
  syncClock(); commit(g);
  g.state = 'ft'; g.running = false; g.runFrom = null; g.due = false;
  wake.off(); save(); render();
}

/* A manual swap: two taps, then everything downstream is replanned from
   the new truth. */
function swap(a, b) {
  const g = S.game; if (!g) return;
  const isGk = (id) => g.gk === id;
  const onF = (id) => g.field.includes(id);
  // two on the bench, or two in the same outfield role: nothing to swap
  if (!isGk(a) && !isGk(b) && onF(a) === onF(b)) return;

  snapshot(g); commit(g);

  if (isGk(a) || isGk(b)) {
    const other = isGk(a) ? b : a;
    const oldGk = g.gk;
    g.gk = other;
    if (onF(other)) g.field = g.field.map(p => p === other ? oldGk : p);
    else g.field = g.field.slice(); // other came from the bench; old keeper sits
    if (!onF(other) && oldGk) g.lastOff[oldGk] = globalStint(S.cfg, g.period, g.stint);
  } else if (onF(a) !== onF(b)) {
    const onId = onF(a) ? a : b;
    const offId = onF(a) ? b : a;
    g.field = g.field.map(p => p === onId ? offId : p);
    g.lastOff[onId] = globalStint(S.cfg, g.period, g.stint);
  }
  g.pending = computePending(g, false);
  save(); render();
}

function setAvailable(id, available) {
  const g = S.game; if (!g) return;
  snapshot(g); commit(g);
  if (available) {
    g.out = g.out.filter(x => x !== id);
    if (!g.squad.includes(id)) g.squad.push(id);
    if (g.played[id] == null) { g.played[id] = 0; g.gkMs[id] = 0; g.lastOff[id] = 0; }
  } else {
    if (!g.out.includes(id)) g.out.push(id);
    g.field = g.field.filter(x => x !== id);
    if (g.gk === id) {
      const ctx = ctxFor(g, false);
      const keepers = ctx.keepers.filter(p => ctx.avail.includes(p));
      g.gk = keepers.length ? pickKeeper(keepers, ctx, id) : null;
      g.field = g.field.filter(x => x !== g.gk);
    }
    // backfill the empty shirt from the bench
    const slots = Math.max(0, S.cfg.onField - (g.gk ? 1 : 0));
    if (g.field.length < slots) {
      const ctx = ctxFor(g, false);
      const bench = ctx.avail.filter(x => !onPitch(g).includes(x));
      const add = pickField(bench, slots - g.field.length, ctx);
      g.field = g.field.concat(add);
    }
  }
  g.pending = computePending(g, false);
  save(); render();
}

/* ------------------------------- goals ----------------------------- */
function addGoal(us, pid) {
  const g = S.game; if (!g) return;
  snapshot(g);
  g.goals.push({ id: uid(), us, pid: pid || null, period: g.period, ms: g.clockMs, at: Date.now() });
  buzz(us ? [40, 60, 40] : [70]);
  if (us) horn.goal();
  save(); render();
  toast(us ? (pid ? nameOf(pid) + ' scores' : 'Goal for us') : 'Goal against', 'Undo', undo);
}
function removeGoal(id) {
  const g = S.game; if (!g) return;
  snapshot(g);
  g.goals = g.goals.filter(x => x.id !== id);
  save(); render();
}
function score(g) {
  return g.goals.reduce((a, x) => (x.us ? a.us++ : a.them++, a), { us: 0, them: 0 });
}

/* ------------------------- sound & vibration ----------------------- */
/* A sine chime does not survive a field full of five-year-olds. These
   are square-wave blasts with a touch of detune for carry. */
const horn = (() => {
  let ctx = null;
  const ac = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const blast = (freq, dur, at, vol) => {
    if (!S.cfg.sound) return;
    const c = ac(); if (!c) return;
    const t0 = c.currentTime + at;
    const gain = c.createGain();
    gain.connect(c.destination);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.setValueAtTime(vol, t0 + dur - 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    [0, 3.5].forEach((detune, i) => {
      const o = c.createOscillator();
      o.type = i ? 'sawtooth' : 'square';
      o.frequency.value = freq;
      o.detune.value = detune;
      o.connect(gain);
      o.start(t0); o.stop(t0 + dur + 0.02);
    });
  };
  return {
    unlock() { ac(); },
    subDue() { blast(494, .34, 0, .38); blast(370, .46, .40, .38); },
    periodEnd() { blast(440, .28, 0, .4); blast(440, .28, .34, .4); blast(330, .7, .68, .4); },
    fullTime() { [0, .26, .52].forEach(t => blast(392, .2, t, .4)); blast(262, 1.0, .82, .42); },
    goal() { [523, 659, 784].forEach((f, i) => blast(f, .16, i * .13, .3)); },
  };
})();

function buzz(pattern) {
  if (!S.cfg.haptics) return;
  try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {}
}

const wake = (() => {
  let lock = null;
  return {
    async on() {
      try { if ('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); } catch (e) {}
    },
    off() { try { lock && lock.release(); } catch (e) {} lock = null; },
    reacquire() { if (S.game && S.game.running) this.on(); },
  };
})();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { wake.reacquire(); tick(); }
  else save(true);
});
window.addEventListener('pagehide', () => save(true));

/* --------------------------- tiny renderer -------------------------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  const add = (c) => {
    if (c == null || c === false) return;
    if (Array.isArray(c)) return c.forEach(add);
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return el;
}
const lbl = (t, cls) => h('div', { class: 'lbl' + (cls ? ' ' + cls : '') }, t);

let overlay = null;      // { kind, ... }
let toastState = null;
let toastTimer = null;

function toast(text, actionLabel, action) {
  clearTimeout(toastTimer);
  toastState = { text, actionLabel, action };
  toastTimer = setTimeout(() => { toastState = null; paintLayer(); }, 4200);
  paintLayer();
}

function open(kind, extra) { overlay = Object.assign({ kind }, extra || {}); paintLayer(); }
function close() { overlay = null; panelSquad.pick = null; paintLayer(); }

/* ============================== screens ============================ */

function render() {
  applyTheme();
  const app = document.getElementById('app');
  const g = S.game;
  let node;
  if (!g) node = screenTeam();
  else if (g.state === 'pre') node = screenLineup();
  else node = screenMatch();
  app.replaceChildren(node);
  paintLayer();
  tick();
}

function applyTheme() {
  const t = S.cfg.theme;
  const root = document.documentElement;
  if (t === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', t);
}

/* ------------------------- 1. team / squad ------------------------- */
function screenTeam() {
  const cfg = S.cfg;
  const squad = new Set(S.lastSquad.filter(id => byId(id)));
  const wrap = h('div', { class: 'match' });

  wrap.append(h('div', { class: 'rail' },
    h('div', { class: 'wordmark grow' }, h('i'), 'PlayTime'),
    h('button', { class: 'rail-btn', onclick: () => open('settings'), 'aria-label': 'Settings' }, '⚙')
  ));

  const body = h('div', { class: 'scroll' });
  wrap.append(body);

  if (!S.roster.length) {
    body.append(
      h('div', { class: 'sec' },
        h('div', { class: 'empty' },
          h('div', { class: 'nm', style: { fontSize: '18px', color: 'var(--ink)' } }, 'Add your team once.'),
          h('div', { style: { marginTop: '6px' } }, 'After that, every match starts with two taps: mark who turned up, kick off.')
        ),
        h('button', { class: 'btn go big grow', style: { width: '100%' }, onclick: () => open('roster') }, 'Add players')
      )
    );
    return wrap;
  }

  // --- attendance ---
  const count = () => S.lastSquad.filter(id => byId(id)).length;
  const head = h('div', { class: 'sec-head' },
    lbl('Who turned up'),
    h('div', { class: 'note', id: 'squad-count' }, count() + ' of ' + S.roster.length)
  );
  const tiles = h('div', { class: 'tiles' },
    S.roster.map(p => {
      const inSquad = squad.has(p.id);
      return h('button', {
        class: 'tile' + (inSquad ? ' in' : ''),
        'aria-pressed': inSquad ? 'true' : 'false',
        onclick: () => {
          if (squad.has(p.id)) squad.delete(p.id); else squad.add(p.id);
          S.lastSquad = S.roster.filter(x => squad.has(x.id)).map(x => x.id);
          save(); render();
        }
      },
        h('div', { class: 'who' }, p.name),
        h('div', { class: 'meta' }, inSquad ? (p.gk && cfg.useGk ? 'Here · keeper' : 'Here') : 'Not here')
      );
    })
  );
  body.append(h('div', { class: 'sec' }, head, tiles,
    h('div', { class: 'row', style: { marginTop: '10px' } },
      h('button', { class: 'btn quiet grow', onclick: () => { S.lastSquad = S.roster.map(p => p.id); save(); render(); } }, 'All here'),
      h('button', { class: 'btn quiet grow', onclick: () => open('roster') }, 'Edit team')
    )
  ));

  // --- match shape ---
  const spp = stintsPerPeriod(cfg);
  const secs = Math.round(stintMs(cfg) / 1000);
  const shape = h('div', { class: 'card' },
    h('div', { class: 'segs', style: { marginBottom: '10px' } },
      [[2, 'Halves'], [4, 'Quarters']].map(([n, t]) =>
        h('button', { class: cfg.periods === n ? 'on' : '', onclick: () => { cfg.periods = n; save(); render(); } }, t))
    ),
    h('div', { class: 'steps' },
      stepper('Each ' + (cfg.periods === 4 ? 'quarter' : 'half'), cfg.periodMin + ' min',
        cfg.periodMin, 1, 60, v => { cfg.periodMin = v; }),
      stepper('Swap every', spp + ' × ' + Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0') + ' per ' + (cfg.periods === 4 ? 'quarter' : 'half'),
        cfg.stintMin, 1, 20, v => { cfg.stintMin = v; }),
      stepper('On the field', cfg.useGk ? 'including the keeper' : 'no keeper', cfg.onField, 1, 11, v => { cfg.onField = v; })
    )
  );
  body.append(h('div', { class: 'sec' }, h('div', { class: 'sec-head' }, lbl('Match')), shape));

  // --- readiness ---
  const avail = S.lastSquad.filter(id => byId(id));
  const need = cfg.onField;
  const ok = avail.length >= need;
  const benchSize = Math.max(0, avail.length - need);
  body.append(h('div', { class: 'note', style: { marginTop: '14px', textAlign: 'center' } },
    ok
      ? (benchSize === 0
        ? 'Everyone plays the whole match — no subs needed.'
        : benchSize + ' on the bench at a time · about ' + mins(estimateMinutes(avail.length, cfg)) + ' min each')
      : 'You need at least ' + need + ' available to field ' + need + '.'
  ));

  wrap.append(h('div', { class: 'dock' },
    h('button', {
      class: 'btn go big grow', disabled: !ok,
      onclick: () => { S.game = newGame(avail); save(); render(); }
    }, 'Set the lineup')
  ));
  return wrap;
}

function estimateMinutes(nAvail, cfg) {
  const total = cfg.periods * cfg.periodMin * 60000;
  return total * Math.min(cfg.onField, nAvail) / Math.max(1, nAvail);
}

function stepper(title, subtitle, value, lo, hi, set) {
  const apply = (d) => { set(clamp(value + d, lo, hi)); save(); render(); };
  return h('div', { class: 'step' },
    h('div', { class: 'cap' }, h('div', { class: 't' }, title), h('div', { class: 's' }, subtitle)),
    h('div', { class: 'ctl' },
      h('button', { onclick: () => apply(-1), 'aria-label': 'Decrease ' + title }, '−'),
      h('div', { class: 'val fig' }, value),
      h('button', { onclick: () => apply(1), 'aria-label': 'Increase ' + title }, '+')
    )
  );
}

/* --------------------------- 2. lineup ----------------------------- */
function screenLineup() {
  const g = S.game, cfg = S.cfg;
  const p = g.pending || computePending(g, true);
  const wrap = h('div', { class: 'match' });

  wrap.append(h('div', { class: 'rail' },
    h('button', { class: 'rail-btn', onclick: () => { S.game = null; save(); render(); }, 'aria-label': 'Back' }, '‹'),
    h('div', { class: 'wordmark grow' }, 'Starting lineup'),
    h('button', { class: 'rail-btn', onclick: () => open('settings'), 'aria-label': 'Settings' }, '⚙')
  ));

  const body = h('div', { class: 'scroll' });
  wrap.append(body);

  const bench = g.squad.filter(id => !p.field.includes(id) && id !== p.gk);
  body.append(h('div', { class: 'sec' },
    h('div', { class: 'sec-head' }, lbl('On the field'), h('div', { class: 'note' }, p.field.length + (p.gk ? 1 : 0) + ' out')),
    h('div', { class: 'strip-row' },
      p.gk && chip(p.gk, 'keeper', 'GK'),
      p.field.map(id => chip(id, 'pitch'))
    )
  ));

  body.append(h('div', { class: 'sec' },
    h('div', { class: 'sec-head' }, lbl('Starting on the bench')),
    bench.length
      ? h('div', { class: 'strip-row' }, bench.map(id => chip(id, 'bench')))
      : h('div', { class: 'note' }, 'Nobody — the whole squad starts.')
  ));

  // projection
  const proj = project(g, cfg, S.roster, orderOf);
  const entries = Object.entries(proj.totals).sort((a, b) => b[1] - a[1]);
  if (entries.length) {
    const max = entries[0][1] || 1;
    const spread = entries.length > 1 ? entries[0][1] - entries[entries.length - 1][1] : 0;
    body.append(h('div', { class: 'sec' },
      h('div', { class: 'sec-head' }, lbl('If it all goes to plan'),
        h('div', { class: 'note' }, spread < 30000 ? 'Even all round' : 'Within ' + Math.ceil(spread / 60000) + ' min')),
      h('div', { class: 'bars' }, entries.map(([id, ms]) => barRow(id, ms, proj.gkTotals[id] || 0, max))),
      cfg.useGk ? gkLegend() : null
    ));
  }

  wrap.append(h('div', { class: 'dock' },
    h('button', {
      class: 'btn square', 'aria-label': 'Shuffle the starters',
      onclick: () => {
        // reshuffle only the tie-break order, so a different — but equally
        // fair — starting XI comes up without touching the team list
        const t = g.squad.slice();
        for (let i = t.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [t[i], t[j]] = [t[j], t[i]];
        }
        g.tieOrder = t;
        g.pending = computePending(g, true);
        save(); render();
      }
    }, '⇄'),
    h('button', { class: 'btn go big grow', onclick: startClock }, 'Kick off')
  ));
  return wrap;
}

function chip(id, kind, tag) {
  const g = S.game;
  const t = g ? playedNow(g, id) : 0;
  return h('span', { class: 'chip ' + kind },
    nameOf(id),
    tag ? h('span', { class: 't' }, tag) : (g && g.state !== 'pre' ? h('span', { class: 't' }, mins(t) + 'm') : null)
  );
}

function barRow(id, ms, gkPart, max) {
  const pct = (v) => (max ? (v / max) * 100 : 0);
  const fieldPart = Math.max(0, ms - gkPart);
  return h('div', { class: 'bar-row' },
    h('div', { class: 'who' }, nameOf(id)),
    h('div', { class: 'bar-track' },
      h('div', { class: 'bar-fill', style: { width: pct(fieldPart) + '%' } }),
      gkPart > 0 ? h('div', { class: 'bar-fill gk', style: { width: pct(gkPart) + '%' } }) : null
    ),
    h('div', { class: 't' }, mins(ms) + 'm')
  );
}
function gkLegend() {
  return h('div', { class: 'legend' },
    h('span', null, h('i', { style: { background: 'var(--on-fill)' } }), 'Outfield'),
    h('span', null, h('i', { style: { background: 'var(--gk-fill)' } }), 'In goal')
  );
}

/* ---------------------------- 3. match ----------------------------- */
function screenMatch() {
  const g = S.game, cfg = S.cfg;
  const sc = score(g);
  const wrap = h('div', { class: 'match' + (g.due && g.state === 'live' ? ' due-state' : '') });

  /* rail: period, the authoritative clock, the score */
  wrap.append(h('div', { class: 'rail' },
    h('button', { class: 'rail-btn', onclick: () => open('sheet', { tab: 'minutes' }), 'aria-label': 'Match details' }, '☰'),
    h('div', { class: 'rail-clock grow' },
      h('span', { class: 'period-chip' + (g.running ? ' live' : ''), id: 'period-chip' }, periodName(g.period, cfg.periods)),
      h('span', { class: 'rail-time fig' + (g.running ? '' : ' paused'), id: 'rail-time' }, mmss(g.clockMs))
    ),
    h('button', {
      class: 'rail-score', onclick: () => open('goal'), 'aria-label': 'Score, tap to record a goal'
    },
      h('span', { class: 'fig us' }, sc.us), h('span', { class: 'sep' }, '–'), h('span', { class: 'fig' }, sc.them)
    )
  ));

  /* progress: one bar per period, ticked at every planned swap */
  const spp = stintsPerPeriod(cfg);
  wrap.append(h('div', { class: 'prog' },
    Array.from({ length: cfg.periods }, (_, i) => {
      const n = i + 1;
      const pct = n < g.period ? 100 : n > g.period ? 0 : (g.clockMs / periodMs(cfg)) * 100;
      return h('div', { class: 'prog-seg' },
        h('div', { class: 'fill', id: n === g.period ? 'prog-live' : null, style: { width: pct + '%' } }),
        Array.from({ length: spp - 1 }, (_, k) =>
          h('div', { class: 'tick', style: { left: ((k + 1) / spp) * 100 + '%' } }))
      );
    })
  ));

  const body = h('div', { class: 'match-body' });
  wrap.append(body);

  /* hero: the one number that tells the coach what to do next */
  const bMs = boundaryMs(cfg, g.stint);
  const left = Math.max(0, bMs - g.clockMs);
  const isLast = g.stint >= spp - 1;
  body.append(h('div', { class: 'hero' + (g.due ? ' due' : ''), id: 'hero' },
    // only the label is announced — a countdown read out every second is
    // useless to a screen reader
    h('div', { class: 'lbl', 'aria-live': 'assertive' },
      g.due ? (isLast ? breakName(g.period, cfg.periods) : 'Swap them now')
            : (isLast ? 'Break in' : 'Next swap in')),
    h('div', {
      class: 'cd fig' + (!g.due && left <= 30000 ? ' warn' : ''), id: 'hero-cd',
      role: 'timer', 'aria-hidden': 'true'
    }, g.due ? 'SWAP' : mmss(left)),
    h('div', { class: 'sub note', id: 'hero-sub' },
      'Stint ' + (g.stint + 1) + ' of ' + spp + ' · ' + periodLong(g.period, cfg.periods) +
      (g.running ? '' : ' · paused'))
  ));

  /* the board */
  body.append(boardEl(g));

  /* who is out there, with their running totals */
  const bench = g.squad.filter(id => !g.out.includes(id) && !onPitch(g).includes(id));
  body.append(h('div', { class: 'strip' },
    h('div', null, lbl('On the pitch'),
      h('div', { class: 'strip-row', style: { marginTop: '6px' } },
        g.gk ? chip(g.gk, 'keeper') : null,
        g.field.map(id => chip(id, 'pitch'))
      )
    ),
    bench.length ? h('div', null, lbl('Bench · least played first'),
      h('div', { class: 'strip-row', style: { marginTop: '6px' } },
        bench.slice().sort((a, b) => playedNow(g, a) - playedNow(g, b)).map(id => chip(id, 'bench'))
      )
    ) : null,
    g.out.length ? h('div', null, lbl('Gone home'),
      h('div', { class: 'strip-row', style: { marginTop: '6px' } }, g.out.map(id => chip(id, 'bench gone')))
    ) : null
  ));

  /* dock — every match-time action within thumb reach */
  const canSwap = !!(g.pending && (g.pending.out.length || g.pending.in.length ||
    (g.pending.gkTo && g.pending.gkTo !== g.pending.gkFrom)));
  const primary = g.due
    ? h('button', { class: 'btn warn big grow', onclick: applySubs },
        g.running ? 'Subs made' : 'Done — play on')
    : g.running
      ? h('button', { class: 'btn go big grow', disabled: !canSwap, onclick: applySubs }, 'Swap now')
      : h('button', { class: 'btn go big grow', onclick: startClock }, g.clockMs > 0 ? 'Resume' : 'Start clock');

  wrap.append(h('div', { class: 'dock' },
    h('button', {
      class: 'btn square', 'aria-label': g.running ? 'Pause the clock' : 'Start the clock',
      onclick: () => g.running ? pauseClock() : startClock()
    }, g.running ? '❚❚' : '▶'),
    primary,
    h('button', { class: 'btn square', onclick: () => open('goal'), 'aria-label': 'Record a goal' }, '⚽')
  ));

  return wrap;
}

function boardEl(g) {
  const p = g.pending;
  const keeperChanges = p && p.gkTo && p.gkFrom && p.gkTo !== p.gkFrom;

  if (!p || (!p.out.length && !p.in.length && !keeperChanges)) {
    return h('div', { class: 'board solo' },
      h('div', { class: 'col' },
        h('div', { class: 'col-head lbl' }, 'Next swap'),
        h('div', { class: 'col-empty' },
          g.squad.filter(id => !g.out.includes(id)).length <= S.cfg.onField
            ? 'Full squad on — nobody to rotate.'
            : 'No changes at the next stint.')
      )
    );
  }

  const col = (kind, arrow, label, ids) => h('div', { class: 'col ' + kind },
    h('div', { class: 'col-head' }, h('span', { class: 'arrow' }, arrow), h('span', { class: 'lbl', style: { color: 'inherit' } }, label)),
    ids.length
      ? h('div', { class: 'col-names' }, ids.map(id => h('div', { class: 'who' }, nameOf(id))))
      : h('div', { class: 'col-empty' }, '—')
  );

  const board = h('div', { class: 'board' },
    col('out', '↓', 'Coming off', p.out),
    col('in', '↑', 'Going on', p.in)
  );

  if (!keeperChanges) return board;
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
    board,
    h('div', { class: 'keeper-swap' },
      h('span', { class: 'lbl', style: { color: 'inherit' } }, 'In goal'),
      h('span', { class: 'nm' }, nameOf(p.gkFrom)), '→', h('span', { class: 'nm' }, nameOf(p.gkTo))
    )
  );
}

/* ======================= overlays: sheets & curtains ================ */
function paintLayer() {
  const layer = document.getElementById('layer');
  const kids = [];
  const g = S.game;

  if (g && g.state === 'break') kids.push(curtainBreak(g));
  else if (g && g.state === 'ft') kids.push(curtainFullTime(g));

  if (overlay) {
    if (overlay.kind === 'sheet') kids.push(sheetMatch(overlay.tab || 'minutes'));
    else if (overlay.kind === 'goal') kids.push(sheetGoal());
    else if (overlay.kind === 'roster') kids.push(sheetRoster());
    else if (overlay.kind === 'settings') kids.push(sheetSettings());
  }

  if (toastState) {
    kids.push(h('div', { class: 'toast' },
      h('span', null, toastState.text),
      toastState.action ? h('button', {
        onclick: () => { const a = toastState.action; toastState = null; clearTimeout(toastTimer); a(); }
      }, toastState.actionLabel) : null
    ));
  }
  layer.replaceChildren(...kids);
}

function veil(inner) {
  return h('div', { class: 'veil', onclick: (e) => { if (e.target.classList.contains('veil')) close(); } }, inner);
}
function sheet(title, bodyKids, footKids) {

      h('button', { class: 'rail-btn', onclick: close, 'aria-label': 'Close' }, '✕')),

  ));
