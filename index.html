/* --- match sheet: minutes / goals / squad / clock --- */
function sheetMatch(tab) {
  const g = S.game;
  const tabs = [['minutes', 'Minutes'], ['goals', 'Goals'], ['squad', 'Squad'], ['clock', 'Clock']];
  const seg = h('div', { class: 'segs', style: { marginBottom: '14px' } },
    tabs.map(([k, t]) => h('button', { class: tab === k ? 'on' : '', onclick: () => open('sheet', { tab: k }) }, t)));

  let panel;
  if (tab === 'minutes') panel = panelMinutes(g);
  else if (tab === 'goals') panel = panelGoals(g);
  else if (tab === 'squad') panel = panelSquad(g);
  else panel = panelClock(g);

  return sheet('Match', [seg, panel],
    h('div', { class: 'row' },
      h('button', { class: 'btn quiet grow', disabled: !g.hist.length, onclick: () => { close(); undo(); } }, 'Undo last'),
      h('button', { class: 'btn quiet grow', onclick: () => open('settings') }, 'Settings'),
      h('button', { class: 'btn grow', onclick: close }, 'Close')
    ));
}

function panelMinutes(g) {
  const avail = g.squad.filter(id => !g.out.includes(id));
  const rows = avail.map(id => [id, playedNow(g, id), g.gkMs[id] || 0]).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return h('div', { class: 'empty' }, 'No players.');
  const max = rows[0][1] || 1;
  const spread = rows[0][1] - rows[rows.length - 1][1];
  return h('div', null,
    h('div', { class: 'note', style: { marginBottom: '10px' } },
      rows.length < 2 ? '' :
      spread < 60000
        ? 'Everyone is within a minute of each other.'
        : 'Widest gap right now: ' + minsPrecise(spread) + '.'),
    h('div', { class: 'bars' }, rows.map(([id, ms, gk], i) =>
      h('div', { class: 'bar-row' + (i === rows.length - 1 && rows.length > 1 ? ' least' : '') },
        h('div', { class: 'who' }, nameOf(id)),
        h('div', { class: 'bar-track' },
          h('div', { class: 'bar-fill', style: { width: (max ? ((ms - gk) / max) * 100 : 0) + '%' } }),
          gk > 0 ? h('div', { class: 'bar-fill gk', style: { width: (max ? (gk / max) * 100 : 0) + '%' } }) : null
        ),
        h('div', { class: 't' }, minsPrecise(ms))
      ))),
    S.cfg.useGk ? gkLegend() : null,
    g.out.length ? h('div', { class: 'sec' }, lbl('Gone home'),
      h('div', { class: 'strip-row', style: { marginTop: '8px' } },
        g.out.map(id => h('span', { class: 'chip bench' }, nameOf(id), h('span', { class: 't' }, minsPrecise(playedNow(g, id))))))
    ) : null
  );
}

function panelGoals(g) {
  const sc = score(g);
  const byPlayer = {};
  g.goals.forEach(x => { if (x.us && x.pid) byPlayer[x.pid] = (byPlayer[x.pid] || 0) + 1; });
  return h('div', null,
    h('div', { class: 'card', style: { textAlign: 'center' } },
      lbl('Score'),
      h('div', { class: 'fig', style: { fontSize: '40px', marginTop: '4px' } },
        h('span', { style: { color: 'var(--on)' } }, sc.us), ' – ', sc.them)
    ),
    h('button', { class: 'btn go tall', style: { width: '100%', marginTop: '12px' }, onclick: () => open('goal') }, 'Record a goal'),
    Object.keys(byPlayer).length ? h('div', { class: 'sec' }, lbl('Scorers'),
      h('div', { class: 'strip-row', style: { marginTop: '8px' } },
        Object.entries(byPlayer).sort((a, b) => b[1] - a[1]).map(([id, n]) =>
          h('span', { class: 'chip pitch' }, nameOf(id), h('span', { class: 't' }, '×' + n))))) : null,
    h('div', { class: 'sec' }, lbl('Timeline'),
      g.goals.length
        ? h('div', { style: { marginTop: '8px' } }, g.goals.slice().reverse().map(x =>
            h('div', { class: 'bar-row', style: { gridTemplateColumns: '1fr auto auto', gap: '10px', padding: '8px 0', borderBottom: '1px solid var(--line)' } },
              h('div', { class: 'who', style: { color: x.us ? 'var(--on)' : 'var(--ink-2)' } },
                x.us ? (x.pid ? nameOf(x.pid) : 'Us') : 'Opponent'),
              h('div', { class: 't' }, periodName(x.period, S.cfg.periods) + ' ' + mmss(x.ms)),
              h('button', { class: 'btn quiet', style: { minHeight: '34px', padding: '0 10px', fontSize: '12px' }, onclick: () => removeGoal(x.id) }, 'Delete')
            )))
        : h('div', { class: 'empty' }, 'No goals yet.'))
  );
}

function panelSquad(g) {
  const swapPick = panelSquad.pick || null;
  const setPick = (id) => {
    if (!swapPick) { panelSquad.pick = id; paintLayer(); return; }
    if (swapPick === id) { panelSquad.pick = null; paintLayer(); return; }
    panelSquad.pick = null;
    swap(swapPick, id);
    paintLayer();
  };
  const pitch = onPitch(g);
  const bench = g.squad.filter(id => !g.out.includes(id) && !pitch.includes(id));

  const tapChip = (id, kind) => h('button', {
    class: 'chip tapable ' + kind + (swapPick === id ? ' picked' : ''),
    onclick: () => setPick(id)
  }, nameOf(id));

  return h('div', null,
    h('div', { class: 'note' }, 'Tap one player on the pitch and one on the bench to swap them right now. The rest of the match replans itself around it.'),
    h('div', { class: 'sec' }, lbl('On the pitch'),
      h('div', { class: 'strip-row', style: { marginTop: '8px' } },
        g.gk ? tapChip(g.gk, 'keeper') : null,
        g.field.map(id => tapChip(id, 'pitch')))),
    h('div', { class: 'sec' }, lbl('Bench'),
      bench.length
        ? h('div', { class: 'strip-row', style: { marginTop: '8px' } }, bench.map(id => tapChip(id, 'bench')))
        : h('div', { class: 'empty' }, 'Nobody on the bench.')),
    h('hr', { class: 'hr' }),
    h('div', null, lbl('Someone arrived late or had to leave'),
      h('div', { class: 'tiles', style: { marginTop: '8px' } },
        S.roster.map(p => {
          const out = g.out.includes(p.id);
          const inSquad = g.squad.includes(p.id) && !out;
          return h('button', {
            class: 'tile' + (inSquad ? ' in' : ''),
            onclick: () => { setAvailable(p.id, !inSquad); paintLayer(); }
          },
            h('div', { class: 'who' }, p.name),
            h('div', { class: 'meta' }, inSquad ? 'Playing' : 'Out'));
        })))
  );
}

function panelClock(g) {
  const nudge = (sec) => { syncClock(); setClock(g.clockMs + sec * 1000); paintLayer(); };
  return h('div', null,
    h('div', { class: 'card', style: { textAlign: 'center' } },
      lbl(periodLong(g.period, S.cfg.periods)),
      h('div', { class: 'fig', style: { fontSize: '46px', lineHeight: 1, marginTop: '4px' } }, mmss(g.clockMs)),
      h('div', { class: 'note', style: { marginTop: '4px' } }, 'of ' + S.cfg.periodMin + ':00')
    ),
    h('div', { class: 'row', style: { marginTop: '12px' } },
      h('button', { class: 'btn grow', onclick: () => nudge(-30) }, '−30s'),
      h('button', { class: 'btn grow', onclick: () => nudge(-10) }, '−10s'),
      h('button', { class: 'btn grow', onclick: () => nudge(10) }, '+10s'),
      h('button', { class: 'btn grow', onclick: () => nudge(30) }, '+30s')
    ),
    h('div', { class: 'note', style: { marginTop: '10px' } },
      'Adjusting the clock keeps everyone’s minutes as they were — it only moves the swap timer.'),
    h('hr', { class: 'hr' }),
    h('button', { class: 'btn tall', style: { width: '100%' }, onclick: () => { close(); raiseDue(true); } },
      'End the ' + periodLong(g.period, S.cfg.periods) + ' now'),
    h('button', { class: 'btn danger tall', style: { width: '100%', marginTop: '8px' }, onclick: () => { close(); endMatch(); } },
      'End the match')
  );
}

/* --- goal sheet: one tap for the common case --- */
function sheetGoal() {
  const g = S.game;
  const pitch = onPitch(g);
  return sheet('Who scored?', [
    h('div', { class: 'note', style: { marginBottom: '10px' } }, 'Tap a name for one of ours, or the button below for the other lot.'),
    h('div', { class: 'tiles' },
      pitch.map(id => h('button', {
        class: 'tile in', onclick: () => { close(); addGoal(true, id); }
      }, h('div', { class: 'who' }, nameOf(id)), h('div', { class: 'meta' }, id === g.gk ? 'Keeper' : 'On the pitch')))
    ),
    h('button', { class: 'btn tall', style: { width: '100%', marginTop: '10px' }, onclick: () => { close(); addGoal(true, null); } },
      'One of ours — not sure who'),
  ],
    h('button', { class: 'btn danger big', style: { width: '100%' }, onclick: () => { close(); addGoal(false, null); } },
      'Goal for the opponent'));
}

/* --- roster editor --- */
function sheetRoster() {
  const input = h('input', { class: 'input', placeholder: 'Player name', autocapitalize: 'words', autocomplete: 'off' });
  const add = () => {
    const n = input.value.trim();
    if (!n) return;
    if (S.roster.some(p => p.name.toLowerCase() === n.toLowerCase())) { input.value = ''; return; }
    const p = { id: uid(), name: n, gk: false };
    S.roster.push(p);
    S.lastSquad.push(p.id);
    input.value = '';
    save(); render();
    setTimeout(() => { const el = document.querySelector('.sheet .input'); el && el.focus(); }, 0);
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

  return sheet('Your team', [
    h('div', { class: 'row' }, input, h('button', { class: 'btn go', onclick: add }, 'Add')),
    S.cfg.useGk
      ? h('div', { class: 'note', style: { marginTop: '10px' } }, 'Tap the glove to say who is allowed in goal.')
      : null,
    h('div', { class: 'sec' },
      S.roster.length
        ? h('div', { style: { display: 'flex', flexDirection: 'column' } },
            S.roster.map(p => h('div', { class: 'bar-row', style: { gridTemplateColumns: '1fr auto auto', gap: '8px', padding: '8px 0', borderBottom: '1px solid var(--line)' } },
              h('div', { class: 'who', style: { fontSize: '16px' } }, p.name),
              S.cfg.useGk ? h('button', {
                class: 'btn quiet', style: { minHeight: '38px', padding: '0 12px', color: p.gk ? 'var(--gk)' : 'var(--ink-3)' },
                onclick: () => { p.gk = !p.gk; save(); render(); }
              }, p.gk ? '🧤 Keeper' : '🧤') : null,
              h('button', {
                class: 'btn quiet', style: { minHeight: '38px', padding: '0 12px', color: 'var(--alert)' },
                onclick: () => {
                  S.roster = S.roster.filter(x => x.id !== p.id);
                  S.lastSquad = S.lastSquad.filter(x => x !== p.id);
                  save(); render();
                }
              }, 'Remove')
            )))
        : h('div', { class: 'empty' }, 'No players yet.'))
  ],
    h('button', { class: 'btn go big', style: { width: '100%' }, onclick: close }, 'Done'));
}

/* --- settings --- */
function sheetSettings() {
  const cfg = S.cfg;
  const sw = (title, sub, key, after) => h('button', {
    class: 'switch' + (cfg[key] ? ' on' : ''), style: { width: '100%', textAlign: 'left' },
    'aria-pressed': cfg[key] ? 'true' : 'false',
    onclick: () => { cfg[key] = !cfg[key]; after && after(); save(); render(); }
  },
    h('div', { class: 'cap' }, h('div', { class: 't', style: { fontSize: '15px', fontWeight: 700 } }, title),
      h('div', { class: 'note' }, sub)),
    h('span', { class: 'track' })
  );

  return sheet('Settings', [
    lbl('During the match'),
    sw('Stop the clock at every swap', 'The buzzer pauses the clock; “Done” starts it again. Turn off if you sub on the fly.', 'pauseAtSub'),
    sw('Buzzer', 'A loud two-tone blast at every swap, break and full time.', 'sound'),
    sw('Vibrate', 'In case the phone is in a pocket.', 'haptics'),

    h('hr', { class: 'hr' }),
    lbl('Goalkeeper'),
    sw('Play with a keeper', 'Off by default — plenty of young leagues do not bother.', 'useGk', () => {
      if (S.cfg.useGk && !S.roster.some(p => p.gk)) S.roster.forEach(p => { p.gk = true; });
    }),
    cfg.useGk ? h('div', { class: 'steps', style: { marginTop: '6px' } },
      stepper('Keeper changes every', cfg.gkEvery + ' stint' + (cfg.gkEvery === 1 ? '' : 's'), cfg.gkEvery, 1, 12, v => { cfg.gkEvery = v; })
    ) : null,
    cfg.useGk ? sw('Time in goal counts as playing time', 'Off means a keeper still gets their full share of outfield minutes.', 'gkCounts') : null,

    h('hr', { class: 'hr' }),
    lbl('Screen'),
    h('div', { class: 'segs', style: { marginTop: '8px' } },
      [['auto', 'Auto'], ['day', 'Daylight'], ['night', 'Night']].map(([k, t]) =>
        h('button', { class: cfg.theme === k ? 'on' : '', onclick: () => { cfg.theme = k; save(); render(); } }, t))),
    h('div', { class: 'note', style: { marginTop: '8px' } }, 'Daylight is a high-contrast mode for bright sun, not just a light theme.'),

    S.game ? h('div', null, h('hr', { class: 'hr' }),
      h('button', {
        class: 'btn danger tall', style: { width: '100%' },
        onclick: () => { if (confirm('Abandon this match? Minutes and goals will be lost.')) { S.game = null; close(); save(); render(); } }
      }, 'Abandon this match')) : null
  ],
    h('button', { class: 'btn go big', style: { width: '100%' }, onclick: close }, 'Done'));
}

/* --- period break --- */
function curtainBreak(g) {
  const cfg = S.cfg, sc = score(g);
  const p = g.pending;
  const benchNext = p ? g.squad.filter(id => !g.out.includes(id) && !p.field.includes(id) && id !== p.gk) : [];
  return h('div', { class: 'curtain' },
    h('div', { style: { flex: '0 0 auto' } },
      lbl(periodLong(g.period, cfg.periods) + ' over'),
      h('div', { class: 'big-label', style: { marginTop: '4px' } }, breakName(g.period, cfg.periods)),
      h('div', { class: 'score-line', style: { marginTop: '10px' } },
        h('span', { style: { color: 'var(--on)' } }, sc.us), ' – ', sc.them)
    ),
    h('div', { class: 'scroll', style: { padding: '18px 0 0', flex: 1 } },
      p ? h('div', null,
        lbl('Starting the ' + periodLong(g.period + 1, cfg.periods)),
        h('div', { class: 'strip-row', style: { marginTop: '8px' } },
          p.gk ? chip(p.gk, 'keeper', 'GK') : null,
          p.field.map(id => chip(id, 'pitch'))),
        benchNext.length ? h('div', { style: { marginTop: '14px' } },
          lbl('Starting on the bench'),
          h('div', { class: 'strip-row', style: { marginTop: '8px' } },
            benchNext.map(id => chip(id, 'bench')))
        ) : null
      ) : null,
      h('div', { class: 'sec' }, lbl('Minutes so far'),
        h('div', { style: { marginTop: '8px' } }, panelMinutes(g)))
    ),
    h('div', { class: 'row', style: { paddingTop: '10px' } },
      h('button', { class: 'btn square', onclick: () => open('sheet', { tab: 'squad' }), 'aria-label': 'Change the squad' }, '☰'),
      h('button', { class: 'btn go big grow', onclick: startNextPeriod }, 'Start the ' + periodLong(g.period + 1, cfg.periods))
    )
  );
}

/* --- full time --- */
function curtainFullTime(g) {
  const cfg = S.cfg, sc = score(g);
  const avail = g.squad.slice();
  const rows = avail.map(id => [id, playedNow(g, id), g.gkMs[id] || 0]).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] || 1 : 1;
  const byPlayer = {};
  g.goals.forEach(x => { if (x.us && x.pid) byPlayer[x.pid] = (byPlayer[x.pid] || 0) + 1; });

  const summary = () => {
    const lines = [];
    lines.push('Full time: ' + sc.us + '–' + sc.them);
    const scorers = Object.entries(byPlayer).sort((a, b) => b[1] - a[1])
      .map(([id, n]) => nameOf(id) + (n > 1 ? ' ×' + n : ''));
    if (scorers.length) lines.push('Scorers: ' + scorers.join(', '));
    lines.push('Minutes: ' + rows.map(([id, ms]) => nameOf(id) + ' ' + mins(ms)).join(', '));
    return lines.join('\n');
  };

  return h('div', { class: 'curtain' },
    h('div', { style: { flex: '0 0 auto' } },
      lbl('Full time'),
      h('div', { class: 'score-line', style: { marginTop: '6px' } },
        h('span', { style: { color: 'var(--on)' } }, sc.us), ' – ', sc.them),
      h('div', { class: 'note', style: { marginTop: '4px' } },
        sc.us > sc.them ? 'A win.' : sc.us < sc.them ? 'Next week.' : 'Honours even.')
    ),
    h('div', { class: 'scroll', style: { padding: '18px 0 0', flex: 1 } },
      Object.keys(byPlayer).length ? h('div', null, lbl('Scorers'),
        h('div', { class: 'strip-row', style: { marginTop: '8px' } },
          Object.entries(byPlayer).sort((a, b) => b[1] - a[1]).map(([id, n]) =>
            h('span', { class: 'chip pitch' }, nameOf(id), h('span', { class: 't' }, '×' + n))))) : null,
      h('div', { class: 'sec' }, lbl('Minutes played'),
        h('div', { class: 'bars', style: { marginTop: '8px' } },
          rows.map(([id, ms, gk]) => h('div', { class: 'bar-row' },
            h('div', { class: 'who' }, nameOf(id)),
            h('div', { class: 'bar-track' },
              h('div', { class: 'bar-fill', style: { width: ((ms - gk) / max) * 100 + '%' } }),
              gk > 0 ? h('div', { class: 'bar-fill gk', style: { width: (gk / max) * 100 + '%' } }) : null),
            h('div', { class: 't' }, minsPrecise(ms))
          ))),
        cfg.useGk ? gkLegend() : null)
    ),
    h('div', { class: 'row', style: { paddingTop: '10px' } },
      h('button', {
        class: 'btn grow', onclick: async () => {
          try { await navigator.clipboard.writeText(summary()); toast('Summary copied'); }
          catch (e) { toast('Could not copy'); }
        }
      }, 'Copy summary'),
      h('button', { class: 'btn go grow', onclick: () => { S.game = null; save(); render(); } }, 'Done')
    )
  );
}

/* ------------------------------ the tick ---------------------------- */
/* Only the numbers that change every second get rewritten; the rest of
   the screen is left alone so a re-render never eats a tap. */
let lastHeartbeat = 0;
function tick() {
  const g = S.game;
  if (!g || g.state === 'pre') return;
  if (g.running) syncClock();

  const cfg = S.cfg;
  const bMs = boundaryMs(cfg, g.stint);
  const spp = stintsPerPeriod(cfg);

  // The period ending is checked on its own, so a coach who subs on the
  // fly and never taps "subs made" still gets a half-time whistle.
  if (g.state === 'live' && g.clockMs >= periodMs(cfg) - 1) { raiseDue(true); return; }
  if (g.state === 'live' && !g.due && g.clockMs >= bMs - 1) { raiseDue(false); return; }

  // keep the saved clock fresh so a reload can pick up where it left off
  if (g.running && Date.now() - lastHeartbeat > 5000) { lastHeartbeat = Date.now(); save(true); }

  const t = document.getElementById('rail-time');
  if (t) {
    t.textContent = mmss(g.clockMs);
    t.classList.toggle('paused', !g.running);
  }
  const pc = document.getElementById('period-chip');
  if (pc) pc.classList.toggle('live', !!g.running);

  const cd = document.getElementById('hero-cd');
  if (cd && !g.due) {
    const left = Math.max(0, bMs - g.clockMs);
    cd.textContent = mmss(left);
    cd.classList.toggle('warn', left <= 30000);
  }
  const sub = document.getElementById('hero-sub');
  if (sub && !g.due) {
    sub.textContent = 'Stint ' + (g.stint + 1) + ' of ' + spp + ' · ' + periodLong(g.period, cfg.periods) +
      (g.running ? '' : ' · paused');
  }
  const bar = document.getElementById('prog-live');
  if (bar) bar.style.width = (g.clockMs / periodMs(cfg)) * 100 + '%';
}
setInterval(tick, 250);

/* Recover from a reload mid-match. A browser tab that reloaded two
   seconds ago should not cost the team two seconds of game clock, but a
   phone that has been shut in a bag for an hour should not gain an hour
   either — so short gaps are honoured and long ones just pause. */
(function recover() {
  const g = S.game;
  if (!g || !g.running) return;
  const gap = Date.now() - (S.savedAt || 0);
  if (gap >= 0 && gap < 5 * 60000) {
    g.clockMs = Math.min(periodMs(S.cfg), g.clockMs + gap);
    g.runBase = g.clockMs;
    g.runFrom = Date.now();
  } else {
    g.running = false;
    g.runFrom = null;
  }
})();

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  const g = S.game;
  if (e.key === 'Escape' && overlay) { close(); return; }
  if (!g || g.state === 'pre') return;
  if (e.code === 'Space') { e.preventDefault(); g.running ? pauseClock() : startClock(); }
  if (e.key.toLowerCase() === 's' && g.due) applySubs();
  if (e.key.toLowerCase() === 'z' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undo(); }
});

render();
</script>
